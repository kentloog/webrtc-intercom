		/>

		<link rel="stylesheet" type="text/css" href="styles/styles.css" />

		<script defer src="/__/firebase/4.10.1/firebase-app.js"></script>
		<!-- include only the Firebase features as you need -->
		<script defer src="/__/firebase/4.10.1/firebase-auth.js"></script>
		<script defer src="/__/firebase/4.10.1/firebase-database.js"></script>
		<script defer src="/__/firebase/4.10.1/firebase-messaging.js"></script>
		<script defer src="/__/firebase/4.10.1/firebase-storage.js"></script>
		<!-- initialize the SDK after all desired features are loaded -->
		<script defer src="/__/firebase/init.js"></script>

		<script src="scripts/common.js"></script>

		<script src="https://code.getmdl.io/1.3.0/material.min.js"></script>
	</head>

	<body>
		<div>
			<main>
				<div>
					<div>
						<div>
							<h2>Login</h2>
						</div>
						<div>
							<form action="#">
								<div>
									<label for="email">Email</label>
									<input type="email" id="email" />
								</div>
								<div>
									<label for="userpass">Password</label>
									<input type="password" id="userpass" />
								</div>
							</form>
						</div>
						<div>
							<button id="sign-in-button">Sign In</button>
						</div>
					</div>

					<!-- <dialog id='email-verification-dialog'>
                    <div>
                        <div>
                            <h2>Email Verification</h2>
                        </div>
                        <div>
                            <p>
                                Your email address has not been verified yet. Please confirm your address.
                            </p>
                        </div>
                        <div>
                            <button id="email-verification-confirm">OK</button>
                        </div>
                    </div>
                </dialog> -->
				</div>

				<script type="text/javascript">
					/**
					 * Handles the sign in button press.
					 */
					function doSignIn() {
						if (firebase.auth().currentUser) {
							firebase.auth().signOut();
						} else {
							var email = document.getElementById('email').value;
							var password = document.getElementById('userpass')
								.value;
							if (email.length < 4) {
								alert('Please enter an email address.');
								return;
							}
							if (password.length < 4) {
								alert('Please enter a password.');
								return;
							}
							// Sign in with email and pass.
							firebase
								.auth()
								.signInWithEmailAndPassword(email, password)
								.then(function() {
									trace('Login success!');
								})
								.catch(function(error) {
									// Handle Errors here.
									var errorCode = error.code;
									var errorMessage = error.message;
									if (errorCode === 'auth/wrong-password') {
										alert('Wrong password.');
									} else {
										alert(errorMessage);
									}
									trace(error);
									document.getElementById(
										'sign-in-button'
									).disabled = false;
								});
						}
						document.getElementById(
							'sign-in-button'
						).disabled = true;
					}

					/**
					 * initApp handles setting up UI event listeners and registering Firebase auth listeners:
					 *  - firebase.auth().onAuthStateChanged: This listener is called when the user is signed in or
					 *    out, and that is where we update the UI.
					 */
					function initApp() {
						// Listening for auth state changes.
						firebase.auth().onAuthStateChanged(function(user) {
							if (user) {
								// User is signed in.
								var displayName = user.displayName;
								var email = user.email;
								var emailVerified = user.emailVerified;
								var providerData = user.providerData;
								trace('Display Name: ' + user.displayName);
								trace('email: ' + user.email);
								trace('emailVerified: ' + user.emailVerified);
								trace('User Id: ' + user.uid + ' Signed In');

								if (emailVerified == false) {
									user.sendEmailVerification()
										.then(function() {
											// Email sent.
											trace(
												'Verification email sent. : ' +
													user.email
											);
										})
										.catch(function(error) {
											// An error happened.
											trace(
												'Error in sending verification email : ' +
													user.email
											);
										});
									//showEmailVerificationDialog();
									alert(
										'Your email address has not been verified yet. Please confirm your address.'
									);
								} else {
									// no need to verify email, moving to main page
									window.location.href = 'index.html';
								}
							} else {
								trace('User Signed out state');
								document
									.getElementById('sign-in-button')
									.addEventListener('click', doSignIn, false);
								document
									.getElementById('userpass')
									.addEventListener('keypress', function(e) {
										if (e.keyCode === 13) {
											e.preventDefault();
											doSignIn();
										}
									});
							}
						});
					}

					window.onload = function() {
						initApp();
					};
				</script>
			</main>
		</div>
	</body>
</html>
