<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">

    <!-- Add to homescreen for Chrome on Android -->
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="icon" sizes="192x192" href="images/android-desktop.png">

    <!-- Add to homescreen for Safari on iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon-precomposed" href="images/ios-desktop.png">

    <title>WebRTC Intercom</title>
    <link href="https://fonts.googleapis.com/css?family=Roboto" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="styles/styles.css">
    <!-- update the version number as needed -->
    <script defer src="/__/firebase/4.10.1/firebase-app.js"></script>
    <!-- include only the Firebase features as you need -->
    <script defer src="/__/firebase/4.10.1/firebase-auth.js"></script>
    <script defer src="/__/firebase/4.10.1/firebase-database.js"></script>
    <script defer src="/__/firebase/4.10.1/firebase-messaging.js"></script>
    <script defer src="/__/firebase/4.10.1/firebase-storage.js"></script>
    <!-- initialize the SDK after all desired features are loaded -->
    <script defer src="/__/firebase/init.js"></script>

    <script src="scripts/common.js"></script>
    <script src="scripts/sdputils.js"></script>
    <script src="scripts/peerconnection_client.js"></script>
    <script src="scripts/firebase_signaling.js"></script>
    <script src="scripts/devicetable.js"></script>
    <script src="scripts/main.js"></script>
    <script src="https://webrtc.github.io/adapter/adapter-latest.js"></script>

    <script src="https://code.getmdl.io/1.3.0/material.min.js"></script>

</head>

<body>
    <div class="wrapper">
        <div>
            <span class="heading">
                WebRTC Intercom
            </span>
            <button class="logout-btn" id="sign-out">Sign Out</button>
        </div>
        <div>
            <main>
                <div id="devices">
                    <table id="device_table">
                        <thead>
                            <tr class="table-heading">
                                <th>Title</th>
                                <th>Description</th>
                                <th>Connection</th>
                                <th>View</th>
                            </tr>
                        </thead>
                        <tbody id="device_table_body">
                            <!-- The rows values in the device table are updated with the contents registered in the database. -->
                        </tbody>
                    </table>
                </div>

                <template id="device_list_tmpl">
                    <tr>
                        <td id="title">TMPL_TITLE</td>
                        <td id="description">TMPL_DESCRIPTION</td>
                        <td id="state">TMPL_STATE</td>
                        <td>
                            <button class="connect-btn" id="button" onclick=ShowVideoStream("TMPL_DEVICEID")>Connect</button>
                        </td>
                    </tr>
                </template>

                <div>
                    <div class="video">
                        <div class="video-container">
                            <video id="remoteVideo" autoplay playsinline controls muted border="1" alt=""></video>
                        </div>
                        <div>
                            <button id="close">Close</button>
                            <button id="open">Open door</button>
                        </div>
                    </div>
                </div>

                <script>
                    var video = document.querySelector('.video');
                    video.hidden = true;
                    var ShowVideoStream = function (data) {
                        video.hidden = false;
                        trace('Start firebase signnaling channel for ' + data);
                        var remoteVideoElement = document.getElementById("remoteVideo");
                        trace('Creating firebase signnaling channel for ' + data);
                        window.firebase_signaling_channel_ = new FirebaseSignalingChannel(data, remoteVideo);
                        window.firebase_signaling_channel_.doSignalingConnect();
                    };

                    var ClosingVideoStream = function () {
                        trace('video stream closing...');
                        if (window.firebase_signaling_channel_ !== undefined &&
                            window.firebase_signaling_channel_ !== null) {
                            window.firebase_signaling_channel_.doSignalingDisconnnect();
                            video.hidden = true;
                            window.firebase_signaling_channel_ = null;
                        }
                    }
                    var OpeningDoor = function () {
                        trace('door opening...');
                        if (window.firebase_signaling_channel_ !== undefined &&
                            window.firebase_signaling_channel_ !== null) {
                            window.firebase_signaling_channel_.doSignalingDoor();
                        }
                    }

                    video.addEventListener('cancel', function () {
                        trace('video canceled');
                        ClosingVideoStream();
                    });

                    document.getElementById('close').addEventListener('click', function () {
                        trace('video closed');
                        ClosingVideoStream();
                    });

                    document.getElementById('open').addEventListener('click', function () {
                        trace('door opening triggered');
                        OpeningDoor();
                    });

                </script>

            </main>
        </div>
    </div>
</body>

</html>
